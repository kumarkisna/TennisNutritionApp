openapi: 3.1.0
info:
  # Do not change the title; generated import paths depend on it.
  title: Api
  version: 0.1.0
  description: Food planning API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: foods
  - name: people
  - name: planner
  - name: preferences
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /foods:
    get:
      operationId: listFoods
      tags: [foods]
      summary: List reference foods and the signed-in user's custom foods
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Food catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Food"
    post:
      operationId: createFood
      tags: [foods]
      summary: Add a custom food with nutrition values per 100 grams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodInput"
      responses:
        "201":
          description: Created food
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Food"
  /foods/discover:
    get:
      operationId: discoverFoods
      tags: [foods]
      summary: Search Open Food Facts for products with nutrition data per 100 grams
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 80
      responses:
        "200":
          description: Matching products with usable per-100 g nutrition
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoveredFood"
        "429":
          description: Search rate limit reached; try again shortly
  /foods/import:
    post:
      operationId: importFood
      tags: [foods]
      summary: Save a source-attributed food in the signed-in user's catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportFoodInput"
      responses:
        "201":
          description: Imported or previously saved food
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Food"
  /foods/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateFood
      tags: [foods]
      summary: Update a custom food owned by the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodUpdate"
      responses:
        "200":
          description: Updated food
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Food"
    delete:
      operationId: deleteFood
      tags: [foods]
      summary: Delete a custom food not used in any meal entries
      responses:
        "204":
          description: Deleted
        "409":
          description: Food is still used in a plan
  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List named people and their individual planning targets
      responses:
        "200":
          description: People in the signed-in account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: createPerson
      tags: [people]
      summary: Add a person with a separate daily plan and activity target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "201":
          description: Created person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
  /people/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Update a person's name or planning target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
    delete:
      operationId: deletePerson
      tags: [people]
      summary: Delete a non-default person and all their planned meals
      responses:
        "204":
          description: Deleted
  /people/{id}/goal-history:
    get:
      operationId: listGoalHistory
      tags: [people]
      summary: List user-provided iron and fat goal changes for an owned person
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Newest-first goal changes, not app verification
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalHistory"
        "401":
          description: Sign-in required
        "404":
          description: Person not found in this account
  /meal-entries:
    get:
      operationId: listMealEntries
      tags: [planner]
      summary: List all meal entries for a date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: personId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Meal entries for the day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealEntry"
    post:
      operationId: createMealEntry
      tags: [planner]
      summary: Plan a food portion for a meal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealEntryInput"
      responses:
        "201":
          description: Created meal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealEntry"
  /meal-entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateMealEntry
      tags: [planner]
      summary: Change a planned portion or meal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealEntryUpdate"
      responses:
        "200":
          description: Updated meal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealEntry"
    delete:
      operationId: deleteMealEntry
      tags: [planner]
      summary: Remove a planned food portion
      responses:
        "204":
          description: Removed
  /preferences:
    get:
      operationId: getPreferences
      tags: [preferences]
      summary: Get the user's activity level and planning target
      responses:
        "200":
          description: Current preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
    put:
      operationId: savePreferences
      tags: [preferences]
      summary: Save the user's activity level and baseline calorie target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesInput"
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
  /daily-summary:
    get:
      operationId: getDailySummary
      tags: [planner]
      summary: Get calorie and macro totals by meal for a date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: personId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Daily nutrition summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySummary"
  /day-activity:
    get:
      operationId: getDayActivity
      tags: [planner]
      summary: Get the planned activity for one person's day
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: personId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Planned activity, or rest if none was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayActivity"
    put:
      operationId: saveDayActivity
      tags: [planner]
      summary: Save the planned activity for one person's day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayActivityInput"
      responses:
        "200":
          description: Saved activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayActivity"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    FoodCategory:
      type: string
      enum: [grains, protein, vegetables, fruit, dairy, other]
    Meal:
      type: string
      enum: [breakfast, lunch, dinner, snack]
    ActivityLevel:
      type: string
      enum: [sedentary, light, moderate, very_active]
    DayActivityType:
      type: string
      enum: [rest, low_intensity, training_60, training_120, endurance, extreme, strength]
    DayActivity:
      type: object
      properties:
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        personId: { type: integer }
        activityType:
          $ref: "#/components/schemas/DayActivityType"
      required: [date, personId, activityType]
    DayActivityInput:
      type: object
      properties:
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        personId: { type: integer, minimum: 1 }
        activityType:
          $ref: "#/components/schemas/DayActivityType"
      required: [date, personId, activityType]
    GoalHistory:
      type: object
      properties:
        id: { type: integer }
        personId: { type: integer }
        nutrient: { type: string, enum: [iron, fat] }
        previousAmount: { type: [number, "null"] }
        amount: { type: [number, "null"] }
        previousSource: { type: [string, "null"] }
        source: { type: [string, "null"] }
        changedAt: { type: string }
      required: [id, personId, nutrient, previousAmount, amount, previousSource, source, changedAt]
    Person:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        isDefault: { type: boolean }
        weightKg: { type: [number, "null"], minimum: 1, maximum: 500 }
        ageYears: { type: [integer, "null"], minimum: 1, maximum: 120 }
        ironGoalMg: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
        ironGoalSource: { type: [string, "null"], maxLength: 300, description: "User-provided source note; not verified by the app." }
        ironGoalReviewedOn: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$', description: "User-provided date the goal was reviewed with a qualified professional; not verified by the app." }
        fatGoalG: { type: [number, "null"], exclusiveMinimum: 0, maximum: 500 }
        fatGoalSource: { type: [string, "null"], maxLength: 300, description: "User-provided source note; not verified by the app." }
        fatGoalReviewedOn: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$', description: "User-provided date the goal was reviewed with a qualified professional; not verified by the app." }
        activityLevel:
          $ref: "#/components/schemas/ActivityLevel"
        baselineCalories: { type: integer }
        activityMultiplier: { type: number }
        targetCalories: { type: integer }
      required: [id, name, isDefault, weightKg, ageYears, ironGoalMg, ironGoalSource, ironGoalReviewedOn, fatGoalG, fatGoalSource, fatGoalReviewedOn, activityLevel, baselineCalories, activityMultiplier, targetCalories]
    PersonInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        weightKg: { type: [number, "null"], minimum: 1, maximum: 500 }
        ageYears: { type: [integer, "null"], minimum: 1, maximum: 120 }
        ironGoalMg: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
        ironGoalSource: { type: [string, "null"], maxLength: 300 }
        ironGoalReviewedOn: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        fatGoalG: { type: [number, "null"], exclusiveMinimum: 0, maximum: 500 }
        fatGoalSource: { type: [string, "null"], maxLength: 300 }
        fatGoalReviewedOn: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        activityLevel:
          $ref: "#/components/schemas/ActivityLevel"
        baselineCalories: { type: integer, minimum: 1000, maximum: 5000 }
      required: [name, activityLevel, baselineCalories]
    PersonUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        weightKg: { type: [number, "null"], minimum: 1, maximum: 500 }
        ageYears: { type: [integer, "null"], minimum: 1, maximum: 120 }
        ironGoalMg: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
        ironGoalSource: { type: [string, "null"], maxLength: 300 }
        ironGoalReviewedOn: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        fatGoalG: { type: [number, "null"], exclusiveMinimum: 0, maximum: 500 }
        fatGoalSource: { type: [string, "null"], maxLength: 300 }
        fatGoalReviewedOn: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        activityLevel:
          $ref: "#/components/schemas/ActivityLevel"
        baselineCalories: { type: integer, minimum: 1000, maximum: 5000 }
    Nutrition:
      type: object
      properties:
        calories: { type: number }
        protein: { type: number }
        carbs: { type: number }
        fat: { type: number }
        fiber: { type: number }
        calciumMg: { type: [number, "null"] }
        ironMg: { type: [number, "null"] }
      required: [calories, protein, carbs, fat, fiber, calciumMg, ironMg]
    Food:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        brand: { type: string }
        sourceUrl: { type: string, format: uri }
        category:
          $ref: "#/components/schemas/FoodCategory"
        source:
          type: string
          enum: [reference, custom, open_food_facts]
        caloriesPer100g: { type: number }
        proteinPer100g: { type: number }
        carbsPer100g: { type: number }
        fatPer100g: { type: number }
        fiberPer100g: { type: number }
        fiberKnown: { type: boolean }
        calciumMgPer100g: { type: [number, "null"] }
        ironMgPer100g: { type: [number, "null"] }
      required: [id, name, category, source, caloriesPer100g, proteinPer100g, carbsPer100g, fatPer100g, fiberPer100g, fiberKnown, calciumMgPer100g, ironMgPer100g]
    DiscoveredFood:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        brand: { type: string }
        sourceUrl: { type: string, format: uri }
        caloriesPer100g: { type: number }
        proteinPer100g: { type: number }
        carbsPer100g: { type: number }
        fatPer100g: { type: number }
        fiberPer100g: { type: number }
        fiberKnown: { type: boolean }
        calciumMgPer100g: { type: [number, "null"] }
        ironMgPer100g: { type: [number, "null"] }
      required: [code, name, sourceUrl, caloriesPer100g, proteinPer100g, carbsPer100g, fatPer100g, fiberPer100g, fiberKnown, calciumMgPer100g, ironMgPer100g]
    ImportFoodInput:
      type: object
      properties:
        code: { type: string, pattern: '^\d{6,20}$' }
      required: [code]
    FoodInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category:
          $ref: "#/components/schemas/FoodCategory"
        caloriesPer100g: { type: number, minimum: 0, maximum: 1000 }
        proteinPer100g: { type: number, minimum: 0, maximum: 100 }
        carbsPer100g: { type: number, minimum: 0, maximum: 100 }
        fatPer100g: { type: number, minimum: 0, maximum: 100 }
        fiberPer100g: { type: number, minimum: 0, maximum: 100 }
        calciumMgPer100g: { type: [number, "null"], minimum: 0, maximum: 10000 }
        ironMgPer100g: { type: [number, "null"], minimum: 0, maximum: 1000 }
      required: [name, category, caloriesPer100g, proteinPer100g, carbsPer100g, fatPer100g, fiberPer100g]
    FoodUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category:
          $ref: "#/components/schemas/FoodCategory"
        caloriesPer100g: { type: number, minimum: 0, maximum: 1000 }
        proteinPer100g: { type: number, minimum: 0, maximum: 100 }
        carbsPer100g: { type: number, minimum: 0, maximum: 100 }
        fatPer100g: { type: number, minimum: 0, maximum: 100 }
        fiberPer100g: { type: number, minimum: 0, maximum: 100 }
        calciumMgPer100g: { type: [number, "null"], minimum: 0, maximum: 10000 }
        ironMgPer100g: { type: [number, "null"], minimum: 0, maximum: 1000 }
    MealEntry:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        personId: { type: integer }
        meal:
          $ref: "#/components/schemas/Meal"
        grams: { type: number }
        food:
          $ref: "#/components/schemas/Food"
        nutrition:
          $ref: "#/components/schemas/Nutrition"
      required: [id, date, personId, meal, grams, food, nutrition]
    MealEntryInput:
      type: object
      properties:
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        personId: { type: integer, minimum: 1 }
        meal:
          $ref: "#/components/schemas/Meal"
        foodId: { type: integer, minimum: 1 }
        grams: { type: number, minimum: 1, maximum: 3000 }
      required: [date, personId, meal, foodId, grams]
    MealEntryUpdate:
      type: object
      properties:
        meal:
          $ref: "#/components/schemas/Meal"
        grams: { type: number, minimum: 1, maximum: 3000 }
    Preferences:
      type: object
      properties:
        activityLevel:
          $ref: "#/components/schemas/ActivityLevel"
        baselineCalories: { type: integer }
        activityMultiplier: { type: number }
        targetCalories: { type: integer }
      required: [activityLevel, baselineCalories, activityMultiplier, targetCalories]
    PreferencesInput:
      type: object
      properties:
        activityLevel:
          $ref: "#/components/schemas/ActivityLevel"
        baselineCalories: { type: integer, minimum: 1000, maximum: 5000 }
      required: [activityLevel, baselineCalories]
    MealSummary:
      type: object
      properties:
        meal:
          $ref: "#/components/schemas/Meal"
        count: { type: integer }
        nutrition:
          $ref: "#/components/schemas/Nutrition"
      required: [meal, count, nutrition]
    DailySummary:
      type: object
      properties:
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        personId: { type: integer }
        targetCalories: { type: integer }
        totals:
          $ref: "#/components/schemas/Nutrition"
        entryCount: { type: integer }
        meals:
          type: array
          items:
            $ref: "#/components/schemas/MealSummary"
      required: [date, personId, targetCalories, totals, entryCount, meals]